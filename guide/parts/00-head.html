<title>Leadership &amp; Motivation Study Guide</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=Source+Sans+3:ital,wght@0,400;0,600;0,700;1,400&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: study handbook — sticky contents rail on wide screens, one reading column, coloured "card types" encode the role of each block (definition, example, trap, plan). */
:root{
  --bg:#f6f7fa; --surface:#ffffff; --surface-2:#eef1f7; --ink:#18213a; --muted:#56607a; --line:#d8dde8;
  --navy:#1c3466; --navy-soft:#e3e9f5; --accent:#d9661a; --accent-soft:#fcebdc;
  --good:#1f7a55; --good-soft:#e2f3ea; --warn:#a8431b; --warn-soft:#fbe6dc; --plan:#5a3fa0; --plan-soft:#ece7f8;
  --f-display:"Archivo","Helvetica Neue",Arial,sans-serif;
  --f-body:"Source Sans 3","Segoe UI",system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1524; --surface:#161e31; --surface-2:#1c2640; --ink:#e7ebf3; --muted:#a3adc4; --line:#2d3958;
  --navy:#9db5ea; --navy-soft:#1f2c4b; --accent:#f08b45; --accent-soft:#3a2617;
  --good:#6fcf9f; --good-soft:#15301f; --warn:#f29a76; --warn-soft:#3a1f16; --plan:#bba6f2; --plan-soft:#28213f; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1524; --surface:#161e31; --surface-2:#1c2640; --ink:#e7ebf3; --muted:#a3adc4; --line:#2d3958;
  --navy:#9db5ea; --navy-soft:#1f2c4b; --accent:#f08b45; --accent-soft:#3a2617;
  --good:#6fcf9f; --good-soft:#15301f; --warn:#f29a76; --warn-soft:#3a1f16; --plan:#bba6f2; --plan-soft:#28213f; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.6}
a{color:var(--navy)}
.wrap{max-width:1240px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;grid-template-columns:1fr;gap:40px}
@media (min-width:1040px){.wrap{grid-template-columns:250px minmax(0,1fr)}}
header.top{padding-block:48px 28px;border-bottom:1px solid var(--line);margin-bottom:8px}
header.top .wrap{display:block}
.eyebrow{font-family:var(--f-mono);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent)}
h1,h2,h3,h4{font-family:var(--f-display);text-wrap:balance;line-height:1.2;color:var(--ink)}
h1{font-size:clamp(2rem,5vw,3.1rem);margin:.3em 0 .3em;font-weight:800;letter-spacing:-.01em}
h1 span{color:var(--navy)}
.lede{max-width:70ch;color:var(--muted);font-size:1.08rem;margin:0}
.meta-row{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}
.chip{font-family:var(--f-mono);font-size:12px;padding:4px 10px;border:1px solid var(--line);border-radius:999px;background:var(--surface);color:var(--muted)}
nav.toc{position:relative}
@media (min-width:1040px){nav.toc .inner{position:sticky;top:calc(env(safe-area-inset-top,0px) + 20px);max-height:calc(100vh - 40px);overflow:auto;padding-right:6px}}
nav.toc details{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
nav.toc summary{font-family:var(--f-display);font-weight:700;cursor:pointer}
nav.toc ol{list-style:none;padding:0;margin:10px 0 0;display:grid;gap:2px}
nav.toc li a{display:block;text-decoration:none;color:var(--ink);font-size:14.5px;padding:4px 8px;border-radius:6px}
nav.toc li a:hover,nav.toc li a:focus-visible{background:var(--navy-soft);outline:none}
nav.toc li.sub a{padding-left:22px;color:var(--muted);font-size:14px}
nav.toc .grp{font-family:var(--f-mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);margin:12px 8px 2px}
main{min-width:0;padding-bottom:80px}
section.part{padding-top:8px;margin-bottom:56px}
section.part>h2{font-size:clamp(1.55rem,3.2vw,2.1rem);margin:0 0 6px;padding-top:16px;border-top:3px solid var(--navy)}
.part-q{font-style:italic;color:var(--muted);margin:0 0 18px}
h3{font-size:1.28rem;margin:34px 0 10px}
h4{font-size:1.05rem;margin:22px 0 6px;color:var(--navy)}
p{max-width:75ch;margin:0 0 12px}
ul,ol{max-width:75ch;padding-left:1.3em;margin:0 0 12px}
li{margin-bottom:4px}
strong{font-weight:700}
.tag{display:inline-block;font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;padding:2px 8px;border-radius:4px;background:var(--navy-soft);color:var(--navy);margin-right:6px;vertical-align:2px}
/* role blocks */
.box{border:1px solid var(--line);border-radius:10px;padding:14px 18px;margin:14px 0;background:var(--surface);max-width:80ch}
.box>.lbl{font-family:var(--f-mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;display:block;margin-bottom:4px}
.box p:last-child,.box ul:last-child,.box ol:last-child{margin-bottom:0}
.def{border-left:4px solid var(--navy)} .def>.lbl{color:var(--navy)}
.ex{background:var(--good-soft);border-color:transparent} .ex>.lbl{color:var(--good)}
.trap{background:var(--warn-soft);border-color:transparent} .trap>.lbl{color:var(--warn)}
.plan{background:var(--plan-soft);border-color:transparent} .plan>.lbl{color:var(--plan)}
.ws{background:var(--accent-soft);border-color:transparent} .ws>.lbl{color:var(--accent)}
.key{background:var(--surface-2);border-color:transparent}
.key ol{margin:0}
/* tables */
.tw{overflow-x:auto;margin:14px 0;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:15px;min-width:560px}
th,td{text-align:left;vertical-align:top;padding:9px 12px;border-bottom:1px solid var(--line)}
th{font-family:var(--f-display);font-weight:700;font-size:13.5px;background:var(--surface-2);color:var(--ink)}
tr:last-child td{border-bottom:0}
td.k{font-weight:700;white-space:nowrap}
/* comparison */
.vs{display:grid;grid-template-columns:1fr;gap:10px;margin:14px 0}
@media (min-width:640px){.vs{grid-template-columns:1fr 1fr}.vs.three{grid-template-columns:repeat(3,1fr)}}
.vs>div{min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.vs h5{font-family:var(--f-display);font-size:1rem;margin:0 0 6px;color:var(--navy)}
.vs p,.vs ul{font-size:15.5px;margin-bottom:6px}
/* diagrams */
figure.dg{margin:18px 0;padding:16px;border:1px solid var(--line);border-radius:12px;background:var(--surface);overflow-x:auto}
figure.dg figcaption{font-size:13.5px;color:var(--muted);margin-top:10px}
svg text{font-family:var(--f-body)}
.s-ink{fill:var(--ink)} .s-muted{fill:var(--muted)} .s-navy{fill:var(--navy)} .s-acc{fill:var(--accent)} .s-surf{fill:var(--surface)} .s-soft{fill:var(--navy-soft)} .s-accsoft{fill:var(--accent-soft)} .s-plansoft{fill:var(--plan-soft)} .s-goodsoft{fill:var(--good-soft)}
.st-line{stroke:var(--line)} .st-navy{stroke:var(--navy)} .st-acc{stroke:var(--accent)} .st-muted{stroke:var(--muted)}
.flow{display:flex;flex-wrap:wrap;gap:8px;align-items:stretch}
.flow>.step{flex:1 1 140px;min-width:0;background:var(--navy-soft);border-radius:8px;padding:10px 12px;font-size:14.5px}
.flow>.step b{display:block;font-family:var(--f-display);color:var(--navy);margin-bottom:2px}
.flow>.arrow{align-self:center;color:var(--accent);font-weight:700}
.grid2x2{display:grid;grid-template-columns:auto 1fr 1fr;grid-template-rows:auto auto auto;gap:6px;min-width:460px;font-size:14.5px}
.grid2x2 .cell{border-radius:8px;padding:10px 12px;min-height:86px}
.grid2x2 .ax{font-family:var(--f-mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;justify-content:center;text-align:center}
.grid2x2 .ax.v{writing-mode:vertical-rl;transform:rotate(180deg)}
.c-good{background:var(--good-soft)} .c-warn{background:var(--warn-soft)} .c-soft{background:var(--surface-2)} .c-navy{background:var(--navy-soft)} .c-acc{background:var(--accent-soft)} .c-plan{background:var(--plan-soft)}
.cell b{display:block;font-family:var(--f-display)}
.bars{display:grid;gap:6px;font-size:14.5px}
.bar{display:grid;grid-template-columns:minmax(120px,190px) 1fr;gap:10px;align-items:center}
.bar .track{height:14px;border-radius:7px;background:var(--surface-2);overflow:hidden}
.bar .fill{height:100%;border-radius:7px;background:var(--navy)}
.bar .fill.neg{background:var(--accent)}
.pyr{display:grid;justify-items:center;gap:4px;font-size:14.5px}
.pyr>div{text-align:center;padding:7px 10px;border-radius:6px;background:var(--navy-soft);color:var(--ink);max-width:100%}
.cont{display:grid;grid-template-columns:repeat(6,minmax(96px,1fr));gap:4px;min-width:620px;font-size:13.5px}
.cont>div{padding:8px;border-radius:6px;text-align:center}
.cont .h{font-family:var(--f-display);font-weight:700;display:block;margin-bottom:2px}
.pill{display:inline-block;font-size:12.5px;padding:1px 8px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);margin:2px 2px 2px 0}
.cols{display:grid;grid-template-columns:1fr;gap:12px}
@media (min-width:720px){.cols{grid-template-columns:repeat(3,1fr)}.cols.two{grid-template-columns:1fr 1fr}}
.cols>div{min-width:0}
.mono{font-family:var(--f-mono);font-size:.86em}
.small{font-size:14.5px;color:var(--muted)}
hr.soft{border:0;border-top:1px dashed var(--line);margin:28px 0}
details.box>summary{cursor:pointer;color:var(--good)}
details.box[open]>summary{margin-bottom:8px}
.update{border:1px dashed var(--accent);border-radius:10px;padding:10px 14px;margin:10px 0 18px;font-size:15px;background:var(--surface)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
html{scroll-behavior:smooth}
section[id],h3[id]{scroll-margin-top:16px}
@media print{
  nav.toc{display:none} .wrap{display:block;max-width:none} body{font-size:11pt;background:#fff}
  section.part{break-before:page} section.part:first-of-type{break-before:auto}
  .box,figure.dg,.tw,.vs>div,.grid2x2,.cont{break-inside:avoid}
  .tw,figure.dg{overflow:visible} table{min-width:0}
  h3,h4{break-after:avoid}
}
</style>
